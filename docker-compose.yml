# PS5 PKG Station - copy this file, change the five paths under x-paths and run `docker compose up -d`.
#
# Every folder is written once, under x-paths. That one value feeds the volume and the PS5PKG_HOST_* variable
# (which only tells the web UI where the folder is on your host, so it can show real paths instead of /library),
# so the two can't drift apart. Prefer a .env file? See "Folders on your NAS" in the README.
x-paths:
  library:   &library   /path/to/ps5/library      # game images (.exfat/.ffpfsc/...) and/or folders, mounted read-only
  downloads: &downloads /path/to/ps5/downloads    # optional second source (RAR/7z/zip sets), mounted read-only
  output:    &output    /path/to/ps5/pkg          # finished .pkg files go here
  work:      &work      /path/to/fast/scratch     # temp space: an SSD with room for your biggest game
  config:    &config    /path/to/ps5-pkg-station/config   # settings, history, logs
services:
  ps5-pkg-station:
    image: ghcr.io/zhangchi198/ps5-pkg-station:latest
    # build: .                      # or build it yourself from this repo
    container_name: ps5-pkg-station
    restart: unless-stopped
    user: "1000:1000"               # uid:gid that owns your output folder (`id` on the host)
    # group_add: ["101"]            # Synology: lets the container write through DSM's ACLs (administrators)
    ports:
      - "8765:8765"
    environment:
      TZ: Etc/UTC                   # your time zone, used by the schedule
      PS5PKG_HOST_LIBRARY: *library
      PS5PKG_HOST_DOWNLOADS: *downloads   # no downloads folder? delete this line, the x-paths line and the volume
      PS5PKG_HOST_OUTPUT: *output
      PS5PKG_HOST_WORK: *work
      PS5PKG_HOST_CONFIG: *config
    mem_limit: 16g                  # optional: cap what builds may use
    volumes:
      - { type: bind, source: *library,   target: /library,   read_only: true }
      - { type: bind, source: *downloads, target: /downloads, read_only: true }
      - { type: bind, source: *output,    target: /output }
      - { type: bind, source: *work,      target: /work }
      - { type: bind, source: *config,    target: /config }
